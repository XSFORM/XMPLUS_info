services:
  xmplus:
    build: .
    container_name: xmplus
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/opt/xmplus                              # проект хоста (для git pull)
      - /var/run/docker.sock:/var/run/docker.sock   # Docker API (для rebuild)
    command: ["python", "-m", "app.main"]
