services:
  xmplus:
    build: .
    container_name: xmplus
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app                                      # код с хоста (git pull + restart)
      - /var/run/docker.sock:/var/run/docker.sock   # Docker API (для restart)
    command: ["python", "-m", "app.main"]
